name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: jdk
          architecture: x64
      - run: javac *.java
      - run: java -ea HelloWorldTest
